function plural(n,one,few,many){const x=Math.abs(n)%100,y=x%10;return (x>10&&x<20)?many:(y===1?one:(y>=2&&y<=4?few:many));}
function starter(){return {days:{},known:{},mistakes:{},attempts:0,correct:0,lastDay:0,history:[]}}
function loadProfile(id){let p;try{p=JSON.parse(localStorage.getItem(STORAGE+id)||'null')}catch{};
 if(p&&typeof p==='object')return Object.assign(starter(),p);
 const initial=starter();
 try{const old=JSON.parse(localStorage.getItem('aischool-v2-'+id)||'null');if(old){initial.attempts=Number(old.attempts)||0;initial.correct=Number(old.correct)||0;initial.legacyImported=true;}}catch{}

}
function save(){if(!state.user||!state.profile)return;try{localStorage.setItem(STORAGE+state.user,JSON.stringify(state.profile))}catch{console.warn('localStorage not available')}}
function switchProfile(id){const p=STUDENTS.find(x=>x.id===id);if(!p)return;state.user=id;state.profile=loadProfile(id);mathState.grade=null;mathState.phase='overview';state.view='home';render();window.scrollTo({top:0,behavior:'smooth'});}
function resetProfile(){state.user=null;state.profile=null;state.view='home';render();}
function profileName(){return STUDENTS.find(s=>s.id===state.user)?.name||''}
function numDays(){return Object.keys(state.profile?.days||{}).length}
function numWords(){return Object.keys(state.profile?.known||{}).length}
function errorsToReview(){return Object.keys(state.profile?.mistakes||{}).filter(id=>(state.profile.mistakes[id]||0)>0).length}
function nextDay(){for(let i=0;i<30;i++)if(!state.profile?.days?.[i])return i;return 29}

 $('profileSwitch').innerHTML=state.user?`👤 ${h(profileName())} · сменить`:'👋 Выбрать ученицу';
 if(state.view==='home')renderHome();else if(state.view==='days')renderDays();else if(state.view==='dictionary')renderDictionary();else if(state.view==='dialogues')renderDialogues();else if(state.view==='parent'){renderParent();mathParentSummary();}else if(state.view==='math')mathRender();else if(state.view==='learning')renderLearning();}
function picker(){return `<div class="panel"><div class="section-title"><h2>Привет! Кто сегодня учится? 👋</h2></div><p class="muted">Обе ученицы начинают с одинаковых заданий, но у каждой будут свои результаты.</p><div class="profile-grid">${STUDENTS.map((s,i)=>`<button class="profile-card p${i+1}" data-action="pickProfile" data-profile="${attr(s.id)}"><span class="emoji">${s.emoji}</span><strong>${h(s.name)}</strong><span class="desc">Выбрать и заниматься →</span></button>`).join('')}</div></div>`;}
function renderHome(){if(!state.user){$('view-home').innerHTML=`<div class="hero"><div><span class="eyebrow">🌟 Добро пожаловать!</span><h1>Английский, который пригодится дома</h1><p>Слушай, говори, играй и учись каждый день. 30 коротких уроков, настоящий запас слов и разговоры с семьёй.</p></div>${heroGraphic()}</div>${picker()}<div class="cards"><div class="tile tint-pink"><div class="mini-icon">📚</div><div class="big">${ALL_WORDS.length}</div><div class="cap">слов и полезных выражений</div></div><div class="tile tint-blue"><div class="mini-icon">📅</div><div class="big">30</div><div class="cap">коротких уроков на месяц</div></div><div class="tile tint-green"><div class="mini-icon">💬</div><div class="big">30</div><div class="cap">бытовых диалогов с озвучкой</div></div></div>`;return;}
 const day=nextDay(),completed=numDays();
 $('view-home').innerHTML=`<div class="hero"><div><span class="eyebrow">✨ Привет, ${h(profileName())}!</span><h1>Сегодня — ещё один шаг к английскому</h1><p>Всего 10–15 минут: выучи слова, пройди проверку и поговори на английском. У тебя получится!</p><button class="hero-btn" data-action="startDay" data-day="${day}">🚀 ${completed>=30?'Повторить последний урок':'Начать день '+(day+1)}</button></div>${heroGraphic()}</div><div class="cards"><div class="tile tint-pink"><div class="mini-icon">🏆</div><div class="big">${completed}<small style="font-size:16px;color:#7785a5"> / 30</small></div><div class="cap">уроков пройдено</div></div><div class="tile tint-blue"><div class="mini-icon">🧠</div><div class="big">${numWords()}</div><div class="cap">слов проверено успешно</div></div><div class="tile tint-green"><div class="mini-icon">⭐</div><div class="big">${state.profile.correct||0}</div><div class="cap">правильных ответов</div></div></div><div class="panel"><div class="section-title"><h2>Твоё путешествие 🎯</h2><span class="pill">${Math.round(completed/30*100)}% месяца</span></div><div class="progress"><span style="width:${completed/30*100}%"></span></div>${errorsToReview()?`<div class="intro"><b>🧩 Слова для повторения: ${errorsToReview()}</b><p class="sub">Это слова, в которых ты ошибалась. Повторим их без спешки.</p><button class="btn pink" data-action="startMistakes">Повторить ошибки →</button></div>`:''}<div class="section-title" style="margin-top:24px"><h2>Следующий урок</h2><button class="btn small" data-nav="days">Все 30 уроков</button></div><div class="intro"><div style="font-size:28px">${TOPICS[day].icon}</div><h3>День ${day+1}. ${h(TOPICS[day].name)}</h3><p class="sub">12 новых слов + проверка + живой бытовой диалог (пока без ИИ)</p><button class="btn primary" data-action="startDay" data-day="${day}">Начать занятие →</button></div></div>`;
}
function renderDays(){if(!state.user){$('view-days').innerHTML=picker();return;}
 $('view-days').innerHTML=`<div class="section-title"><div><h2>📅 Твой план на 30 дней</h2><p class="sub">12 новых слов в каждом уроке. Можно проходить в своём темпе и возвращаться к любому дню.</p></div><span class="pill">${numDays()} / 30 пройдено</span></div><div class="daily-list">${TOPICS.map((t,i)=>{const done=state.profile.days[i];return `<article class="lesson-tile ${done?'done':''}"><div class="stage-top"><div class="round">${t.icon}</div><span class="pill">${done?'✅ Готово':'День '+(i+1)}</span></div><h3>${h(t.name)}</h3><p>${dayDifficulty(i)} · 12 слов · диалог «${h(DIALOGUES[i].title)}»</p><button class="btn ${done?'':'primary'} small" data-action="startDay" data-day="${i}">${done?'🔁 Повторить':'Начать →'}</button></article>`}).join('')}</div>`;
}
function startLesson(day,kind='day'){if(!state.user){chooseView('home');return;}
 const i=Math.min(29,Math.max(0,Number(day)||0));state.day=i;state.topic=i;state.kind=kind;state.words=TOPICS[i].words.slice(0,12);state.phase='cards';state.wordIndex=0;state.qIndex=0;state.qCorrect=0;state.qWrong=false;state.qAnswered=false;state.qRevealed=false;state.qOptions={};state.talkAnswered=false;state.view='learning';render();window.scrollTo({top:0,behavior:'smooth'});
}
function practiceTopic(topic){if(!state.user){chooseView('home');return;}const i=Number(topic),arr=TOPICS[i].words;
 state.day=i;state.topic=i;state.kind='practice';state.words=arr.slice(12,24).length>=8?arr.slice(12,24):arr.slice(0,12);state.phase='cards';state.wordIndex=0;state.qIndex=0;state.qCorrect=0;state.qWrong=false;state.qAnswered=false;state.qRevealed=false;state.qOptions={};state.talkAnswered=false;state.view='learning';render();window.scrollTo({top:0,behavior:'smooth'});
}
function startMistakes(){if(!state.user)return;const ids=Object.keys(state.profile.mistakes||{}).filter(id=>(state.profile.mistakes[id]||0)>0).sort((a,b)=>state.profile.mistakes[b]-state.profile.mistakes[a]);const arr=ids.map(id=>ALL_WORDS.find(w=>w.en.toLowerCase()===id)).filter(Boolean).slice(0,12);if(!arr.length){chooseView('home');return;}state.kind='mistakes';state.words=arr;state.day=arr[0].topic;state.topic=arr[0].topic;state.phase='cards';state.wordIndex=0;state.qIndex=0;state.qCorrect=0;state.qWrong=false;state.qAnswered=false;state.qOptions={};state.view='learning';render();window.scrollTo({top:0,behavior:'smooth'});}
function startDialogue(i){state.day=Number(i);state.topic=Number(i);state.kind='dialogue';state.phase='talk';state.talkAnswered=false;state.view='learning';render();window.scrollTo({top:0,behavior:'smooth'});}
function learningHead(){const t=TOPICS[state.topic],label=state.kind==='day'?`День ${state.day+1}`:state.kind==='practice'?'Тренировка слов':state.kind==='mistakes'?'Повторение ошибок':'Диалог';
 return `<div class="stage-top"><button class="btn ghost small" data-nav="${state.kind==='dialogue'?'dialogues':state.kind==='practice'?'dictionary':'home'}">← К занятиям</button><span class="pill">${label} · ${h(t.name)}</span></div><div class="stage-top" style="margin-top:15px"><h2>${t.icon} ${h(t.name)}</h2><div class="stage-options"><button class="stage ${state.phase==='cards'?'selected':''}" data-action="setPhase" data-phase="cards" ${state.kind==='dialogue'?'disabled':''}>1. Слова</button><button class="stage ${state.phase==='quiz'?'selected':''}" data-action="setPhase" data-phase="quiz" ${state.kind==='dialogue'?'disabled':''}>2. Проверка</button><button class="stage ${state.phase==='talk'?'selected':''}" data-action="setPhase" data-phase="talk">3. Диалог</button></div></div>`;}
function renderLearning(){if(!state.user){chooseView('home');return;}
 const node=$('view-learning');let content=learningHead();
 if(state.phase==='cards')content+=renderCards();else if(state.phase==='quiz')content+=quizMarkup();else content+=renderTalk();
 node.innerHTML=`<div class="panel learn-layout">${content}</div>`;
 if(state.phase==='quiz'&&state.qAnswered)renderQuizFeedback();}
function renderCards(){const item=state.words[state.wordIndex],t=TOPICS[state.topic];if(!item)return '<p>В этой теме пока нет слов.</p>';
 return `<p class="sub">Сначала послушай слово и попробуй повторить его вслух. Затем посмотри перевод.</p><div class="progress"><span style="width:${(state.wordIndex+1)/state.words.length*100}%"></span></div><div class="word-display"><div class="emoji">${t.icon}</div><div class="label">Слово ${state.wordIndex+1} из ${state.words.length}</div><div class="word">${h(item.en)}</div><button class="btn sun small" data-say="${attr(item.en)}">🔊 Послушать</button><div class="meaning"><div>🇷🇺 ${h(item.ru)}</div><div>🇵🇱 ${h(item.pl)}</div></div></div><div class="stage-top"><button class="btn" data-action="previousCard" ${state.wordIndex===0?'disabled':''}>← Назад</button><span class="sub">${state.wordIndex+1} / ${state.words.length}</span>${state.wordIndex===state.words.length-1?'<button class="btn primary" data-action="setPhase" data-phase="quiz">К проверке →</button>':'<button class="btn primary" data-action="nextCard">Следующее слово →</button>'}</div>`;
}
function getOptions(){const index=state.qIndex;if(state.qOptions[index])return state.qOptions[index];const answer=state.words[index];let pool=TOPICS[answer.topic ?? state.topic].words.filter(w=>w.en!==answer.en);
 if(pool.length<3)pool=ALL_WORDS.filter(w=>w.en!==answer.en);
 const select=[...pool].sort((a,b)=>hash(b.en+index)-hash(a.en+index)).slice(0,3);
 let arr=[answer,...select].sort((a,b)=>hash(a.en+index+'seed')-hash(b.en+index+'seed'));
 state.qOptions[index]=arr;return arr;
}
function hash(s){let n=0;for(let i=0;i<s.length;i++)n=(n*31+s.charCodeAt(i))|0;return n;}
function quizMarkup(){const item=state.words[state.qIndex];if(!item)return `<h2>Готово!</h2><button class="btn primary" data-action="setPhase" data-phase="talk">Перейти к диалогу →</button>`;
 const mode=state.qMode;
 let html=`<div class="stage-top"><span class="pill">Задание ${state.qIndex+1} из ${state.words.length}</span><span class="pill">⭐ С первого раза: ${state.qCorrect}</span></div><div class="progress" style="margin:13px 0"><span style="width:${state.qIndex/state.words.length*100}%"></span></div><h3>Как это будет по-английски?</h3><div class="word-display" style="min-height:165px;padding:22px"><div class="label">Переведи слово или выражение</div><div class="meaning"><div>🇷🇺 ${h(item.ru)}</div><div>🇵🇱 ${h(item.pl)}</div></div></div><div class="buttons"><button class="btn small ${mode==='pick'?'primary':''}" data-action="quizMode" data-mode="pick">Выбрать ответ</button><button class="btn small ${mode==='type'?'primary':''}" data-action="quizMode" data-mode="type">Написать самой</button></div>`;
 if(!state.qAnswered){if(mode==='pick'){html+=`<div class="options">${getOptions().map(o=>`<button data-action="quizChoice" data-answer="${attr(o.en)}">${h(o.en)}</button>`).join('')}</div>`;}else{html+=`<input id="typedAnswer" class="text-answer" type="text" placeholder="Напиши по-английски…" autocomplete="off" spellcheck="false" aria-label="Ответ на английском" /><button class="btn primary" data-action="quizCheck">Проверить</button>`;}}
 html+=`<div id="qFeedback" aria-live="polite"></div>`;
 if(state.qAnswered)html+=`<div class="buttons"><button class="btn sun" data-say="${attr(item.en)}">🔊 ${h(item.en)}</button><button class="btn primary" data-action="nextQuiz">${state.qIndex===state.words.length-1?'Закончить проверку →':'Следующий вопрос →'}</button></div>`;
 else html+=`<div class="buttons" style="margin-top:12px"><button class="btn small" data-action="revealAnswer">💡 Показать ответ и перейти дальше</button></div>`;
 return html;
}
function normalize(s){return String(s||'').toLocaleLowerCase('en-US').replace(/[’]/g,"'").trim().replace(/\s+/g,' ').replace(/[.!?]+$/,'');}
function feedback(text,good){const n=$('qFeedback');if(!n)return;n.className='feedback '+(good?'good':'bad');n.textContent=text;}
function quizSubmit(value){if(state.phase!=='quiz'||state.qAnswered)return;
 const item=state.words[state.qIndex],input=normalize(value);if(!input){feedback('Сначала выбери или напиши ответ.',false);return;}
 const good=input===normalize(item.en);state.profile.attempts=(state.profile.attempts||0)+1;
 if(good){if(!state.qWrong)state.qCorrect++;state.profile.correct=(state.profile.correct||0)+1;state.profile.known[item.en.toLowerCase()]=true;
  const count=state.profile.mistakes[item.en.toLowerCase()]||0;if(count<=1)delete state.profile.mistakes[item.en.toLowerCase()];else state.profile.mistakes[item.en.toLowerCase()]=count-1;
  state.qAnswered=true;save();renderLearning();feedback(state.qWrong?'✅ Теперь правильно! Ошибки помогают учиться.':'🎉 Правильно! Отличная работа!',true);return;
 }
 state.qWrong=true;state.profile.mistakes[item.en.toLowerCase()]=(state.profile.mistakes[item.en.toLowerCase()]||0)+1;save();
 const hint=item.en.length<=3?`В слове ${item.en.length} буквы.`:`Подсказка: первая буква — ${item.en[0]}, всего ${item.en.length} символов.`;
 feedback(`Пока не совсем верно. ${hint} Попробуй исправить ответ и нажать «Проверить» снова.`,false);
 const inputEl=$('typedAnswer');if(inputEl){inputEl.focus();inputEl.select();}
}
function revealAnswer(){if(state.phase!=='quiz'||state.qAnswered)return;state.qWrong=true;state.qAnswered=true;const item=state.words[state.qIndex];state.profile.mistakes[item.en.toLowerCase()]=(state.profile.mistakes[item.en.toLowerCase()]||0)+1;save();renderLearning();feedback(`Правильный ответ: ${item.en}. Послушай и повтори перед следующим вопросом.`,false);}
function renderQuizFeedback(){const n=$('qFeedback');if(!n)return;const item=state.words[state.qIndex];n.className='feedback '+(state.qRevealed?'bad':'good');n.textContent=state.qRevealed?`Правильный ответ: ${item.en}.`:`Ответ: ${item.en}. Можно послушать произношение.`;}
function nextQuiz(){if(!state.qAnswered)return;state.qIndex++;state.qWrong=false;state.qAnswered=false;state.qRevealed=false;
 if(state.qIndex>=state.words.length){if(state.kind==='mistakes'){save();chooseView('home');return;}state.profile.lastDay=state.day;
 if(state.kind==='day'){const old=state.profile.days[state.day];state.profile.days[state.day]={score:Math.max(state.qCorrect,old?.score||0),date:new Date().toISOString().slice(0,10)};state.profile.history.push({day:state.day+1,score:state.qCorrect,total:state.words.length,date:new Date().toISOString()});state.profile.history=state.profile.history.slice(-100);}
 save();state.phase='talk';state.talkAnswered=false;render();window.scrollTo({top:0,behavior:'smooth'});return;}
 renderLearning();}
function setPhase(phase){if(state.kind==='dialogue'&&phase!=='talk')return;if(!['cards','quiz','talk'].includes(phase))return;state.phase=phase;
 if(phase==='quiz'){state.qIndex=0;state.qWrong=false;state.qAnswered=false;state.qCorrect=0;state.qOptions={};}
 if(phase==='talk')state.talkAnswered=false;

function renderTalk(){const d=DIALOGUES[state.day],target=d.lines[1],alts=[...d.lines.map(x=>x.en)];
 return `<div class="intro"><h3 style="margin:0 0 7px">💬 ${h(d.title)}</h3><div class="sub">Разыграйте диалог вдвоём. Нажимай 🔊, повторяй фразы и меняйтесь ролями. Это разговорный тренажёр с готовыми фразами, пока не живой ИИ-учитель.</div></div><div class="dialogue">${d.lines.map((line,i)=>`<div class="bubble ${i%2?'alt':''}"><div class="speaker">${h(line.speaker)}</div><div class="en">${h(line.en)}</div><div class="translation">🇷🇺 ${h(line.ru)}<br>🇵🇱 ${h(line.pl)}</div><button class="say" data-say="${attr(line.en)}">🔊 Послушать фразу</button></div>`).join('')}</div><div class="intro"><h3>🎯 Мини-проверка: какая фраза означает…</h3><div style="font-size:16px;font-weight:800">«${h(target.ru)}»</div><div class="options">${alts.sort((a,b)=>hash(a+'say'+state.day)-hash(b+'say'+state.day)).map(x=>`<button data-action="talkCheck" data-answer="${attr(x)}" ${state.talkAnswered?'disabled':''}>${h(x)}</button>`).join('')}</div><div id="talkFeedback" aria-live="polite">${state.talkAnswered?`<div class="feedback good">Молодец! Теперь попробуйте произнести диалог без подсказок.</div>`:''}</div></div><div class="stage-top"><button class="btn" data-nav="${state.kind==='dialogue'?'dialogues':state.kind==='practice'?'dictionary':'home'}">← Все занятия</button><button class="btn primary" data-action="finishLearning">${state.kind==='day'?'🏆 На главную':'✅ Закончить'} →</button></div>`;
}
function checkTalk(answer){const target=DIALOGUES[state.day].lines[1].en;const feedback=$('talkFeedback');if(normalize(answer)===normalize(target)){state.talkAnswered=true;renderLearning();}else if(feedback){feedback.innerHTML='<div class="feedback bad">Почти! Попробуй другой вариант.</div>';}}
function renderDictionary(){if(!state.user){$('view-dictionary').innerHTML=picker();return;}
 $('view-dictionary').innerHTML=`<div class="section-title"><div><h2>📖 Большой словарь</h2><p class="sub">${ALL_WORDS.length} уникальных слов и выражений · Английский / Польский / Русский</p></div></div><div class="panel"><div class="select-row"><input id="wordSearch" class="search-input" placeholder="🔎 Найти слово или перевод…" value="${attr(state.search)}" aria-label="Поиск по словарю"/><select id="topicFilter" aria-label="Выбери тему"><option value="all">Все темы</option>${TOPICS.map((t,i)=>`<option value="${i}" ${String(state.dictTopic)===String(i)?'selected':''}>${t.icon} ${h(t.name)}</option>`).join('')}</select></div><div class="buttons"><span class="pill" id="foundCount"></span><button class="btn small" data-action="practiceTopic" data-topic="${state.dictTopic==='all'?0:state.dictTopic}">🎯 Тренировать выбранную тему</button></div></div><div id="wordResults"></div>`;

function filteredWords(){const q=normalize(state.search);return ALL_WORDS.filter(x=>(state.dictTopic==='all'||x.topic===Number(state.dictTopic))&&(!q||[x.en,x.pl,x.ru].some(v=>normalize(v).includes(q))))}
function updateResults(){const all=filteredWords(),shown=all.slice(0,state.dictLimit);$('foundCount').textContent=`Найдено: ${all.length}`;
 $('wordResults').innerHTML=all.length?`<div class="vocab-grid">${shown.map(x=>`<div class="vocab-item"><span class="sub">${TOPICS[x.topic].icon} ${h(TOPICS[x.topic].name)}</span><div class="en">${h(x.en)}</div><div class="translation">🇷🇺 ${h(x.ru)}<br>🇵🇱 ${h(x.pl)}</div><button data-say="${attr(x.en)}">🔊 Послушать</button></div>`).join('')}</div>${shown.length<all.length?`<div style="text-align:center;margin:20px"><button class="btn primary" data-action="moreWords">Показать ещё ${Math.min(60,all.length-shown.length)} →</button></div>`:''}`:'<div class="empty">🔎 Ничего не найдено. Попробуй другое слово.</div>';
}
function renderDialogues(){if(!state.user){$('view-dialogues').innerHTML=picker();return;}
 $('view-dialogues').innerHTML=`<div class="section-title"><div><h2>💬 Разговорный английский</h2><p class="sub">30 диалогов из жизни. Для Доминики, Даниэллы, Даниэля и папы. Читай, слушай и повторяй вслух.</p></div></div><div class="intro"><b>🗣️ Как заниматься:</b> первая девочка читает реплики одного героя, вторая отвечает. Потом поменяйтесь ролями. Младшему Даниэлю можно говорить самые простые фразы, например <i>Come here!</i> и <i>Let's play!</i></div><div class="dialogue-grid">${DIALOGUES.map((d,i)=>`<div class="dialogue-tile"><div style="font-size:28px">${TOPICS[i].icon}</div><h3>${i+1}. ${h(d.title)}</h3><p>${h(d.lines[0].en)}</p><button class="btn primary small" data-action="startDialogue" data-day="${i}">Открыть диалог →</button></div>`).join('')}</div>`;
}
function renderParent(){const entries=STUDENTS.map(s=>({student:s,data:loadProfile(s.id)}));const total=entries.map(o=>({name:o.student.name,days:Object.keys(o.data.days||{}).length,words:Object.keys(o.data.known||{}).length,correct:o.data.correct||0,attempts:o.data.attempts||0}));
 $('view-parent').innerHTML=`<div class="section-title"><h2>📊 Родительский кабинет</h2></div><div class="intro">Здесь результаты <b>только этого браузера</b>. На телефоне Доминики, телефоне Даниэллы и компьютере будет разная статистика. Для общего кабинета понадобится отдельная база данных. Раздел пока без пароля.</div><div class="cards">${total.map((p,i)=>`<div class="tile ${i?'tint-pink':'tint-blue'}"><div class="mini-icon">${STUDENTS[i].emoji}</div><h3>${h(p.name)}</h3><p><b>${p.days}/30</b> уроков<br><b>${p.words}</b> слов<br><b>${p.correct}</b> верных из <b>${p.attempts}</b> попыток</p></div>`).join('')}<div class="tile tint-green"><div class="mini-icon">🎓</div><h3>Наш курс</h3><p>30 дней · ${ALL_WORDS.length} слов и выражений · ${DIALOGUES.length} диалогов</p></div></div><div class="panel"><h3>💾 Сохранить результаты</h3><p class="sub">Скачай отчёт, если хочешь сохранить статистику на случай очистки браузера.</p><div class="buttons"><button class="btn primary" data-action="exportReport">⬇ Скачать отчёт</button><button class="btn danger" data-action="resetProgress">🗑 Очистить прогресс этого устройства</button></div></div><div class="hint">🔒 Настоящего ИИ-преподавателя и голосовой проверки произношения пока нет. Здесь работают готовые задания и озвучка средствами браузера; платные ключи не нужны.</div>`;
}
function exportReport(){const payload={exportedAt:new Date().toISOString(),version:'AI School Kids v4',students:STUDENTS.map(s=>({student:s.name,progress:loadProfile(s.id)}))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='AI-School-report.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}
function resetProgress(){if(!confirm('Удалить все результаты ОБЕИХ учениц только в этом браузере? Это действие нельзя отменить.'))return;STUDENTS.forEach(s=>{try{localStorage.removeItem(STORAGE+s.id)}catch{}});if(state.user)state.profile=starter();render();}
function speak(text){if(!('speechSynthesis' in window)){alert('На этом устройстве озвучка недоступна. Попробуй Chrome.');return;}
 try{window.speechSynthesis.cancel();const voice=new SpeechSynthesisUtterance(String(text));voice.lang='en-US';voice.rate=.86;voice.pitch=1.04;window.speechSynthesis.speak(voice);}catch{alert('Не удалось воспроизвести звук. Проверь громкость устройства.')}}
function onClick(e){const say=e.target.closest('[data-say]');if(say){speak(say.dataset.say);return;}
 const nav=e.target.closest('[data-nav]');if(nav){chooseView(nav.dataset.nav);return;}
 const btn=e.target.closest('[data-action]');if(!btn)return;
 switch(btn.dataset.action){
 case 'pickProfile':switchProfile(btn.dataset.profile);break;
 case 'switchProfile':resetProfile();break;
 case 'startDay':startLesson(btn.dataset.day);break;
 case 'startMistakes':startMistakes();break;
 case 'practiceTopic':practiceTopic(btn.dataset.topic);break;
 case 'startDialogue':startDialogue(btn.dataset.day);break;
 case 'previousCard':state.wordIndex=Math.max(0,state.wordIndex-1);renderLearning();break;
 case 'nextCard':state.wordIndex=Math.min(state.words.length-1,state.wordIndex+1);renderLearning();break;
 case 'setPhase':setPhase(btn.dataset.phase);break;
 case 'quizMode':if(!state.qAnswered){state.qMode=btn.dataset.mode;renderLearning();}break;
 case 'quizChoice':quizSubmit(btn.dataset.answer);break;
 case 'quizCheck':quizSubmit($('typedAnswer')?.value);break;
 case 'revealAnswer':revealAnswer();break;
 case 'nextQuiz':nextQuiz();break;
 case 'talkCheck':checkTalk(btn.dataset.answer);break;
 case 'finishLearning':chooseView(state.kind==='day'?'home':state.kind==='practice'?'dictionary':'dialogues');break;
 case 'moreWords':state.dictLimit+=60;updateResults();break;
 case 'exportReport':exportReport();break;
 case 'resetProgress':resetProgress();break;
 }
}
document.addEventListener('click',onClick);
document.addEventListener('input',e=>{if(e.target.id==='wordSearch'){state.search=e.target.value;state.dictLimit=60;updateResults();}});
document.addEventListener('change',e=>{if(e.target.id==='topicFilter'){state.dictTopic=e.target.value;state.dictLimit=60;updateResults();const b=document.querySelector('[data-action="practiceTopic"]');if(b)b.dataset.topic=state.dictTopic==='all'?'0':state.dictTopic;}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='typedAnswer'){e.preventDefault();quizSubmit(e.target.value);}});

/* AI School Kids: mathematics — deterministic offline worksheets for 5th and 7th grade. */
const MATH_DATA=JSON.parse(document.getElementById('mathTasks').textContent);
const mathState={grade:null,day:0,question:0,phase:'overview',pending:'',feedback:'',error:false,ru:false};
const MATH_KEY='aischool-math-v1-';
function mathDefaultGrade(){return state.user==='Доминика'?7:5;}
function mathSelectedGrade(){return mathState.grade||mathDefaultGrade();}
function mathLoad(id){try{const p=JSON.parse(localStorage.getItem(MATH_KEY+id)||'{}');if(p&&typeof p==='object'&&p.days)return p}catch{}return {days:{}};}
function mathSave(p){if(!state.user)return;try{localStorage.setItem(MATH_KEY+state.user,JSON.stringify(p))}catch{console.warn('Nie udało się zapisać postępów matematyki.')}}
function mathDayKey(grade,day){return grade+'-'+day}
function mathRecord(grade,day){const p=mathLoad(state.user);const key=mathDayKey(grade,day);if(!p.days[key])p.days[key]={items:{},finished:null,score:0};return {p,key,rec:p.days[key]};}
function mathRowStats(id,grade){const p=mathLoad(id);let done=0,first=0,solved=0;for(let i=0;i<30;i++){const rec=p.days[mathDayKey(grade,i)];if(!rec)continue;if(rec.finished)done++;for(const value of Object.values(rec.items||{})){if(value.done){solved++;if(value.first)first++;}}}return {done,first,solved};}
function mathChooseGrade(value){const grade=Number(value);if(![5,7].includes(grade))return;mathState.grade=grade;mathState.phase='overview';mathState.pending='';mathState.feedback='';render();}
function mathStartDay(day){if(!state.user){chooseView('home');return;}const d=Number(day);if(!Number.isInteger(d)||d<0||d>29)return;
 const grade=mathSelectedGrade(),rec=mathLoad(state.user).days[mathDayKey(grade,d)];
 const first=Array.from({length:10},(_,i)=>i).find(i=>!rec?.items?.[i]?.done);
 mathState.day=d;mathState.question=first===undefined?9:first;mathState.phase=first===undefined?'summary':'task';
 mathState.pending='';mathState.feedback='';mathState.error=false;render();}
function mathNextUnfinished(){const gr=mathSelectedGrade();const p=mathLoad(state.user);for(let d=0;d<30;d++)if(!p.days[mathDayKey(gr,d)]?.finished)return d;return 29;}
function mathCurrent(){return MATH_DATA[String(mathSelectedGrade())][mathState.day].tasks[mathState.question];}
function mathFeedback(msg,bad){mathState.feedback=msg;mathState.error=!!bad;}
function mathNormalizeAnswer(answer){
 let s=String(answer??'').trim().replace(/−/g,'-').replace(/\s+/g,' ').replace(',', '.').replace(/[–—]/g,'-');
 if(!s)return NaN;
 // Supports decimals, ordinary fractions and mixed numbers such as 1 1/2.
 let m=s.match(/^(-?\d+)\s+((?:\d+))\s*\/\s*(\d+)$/);
 if(m){const d=+m[3];return d?+m[1]+Math.sign(+m[1]||1)*(+m[2])/d:NaN;}
 m=s.match(/^(-?\d+)\s*\/\s*(-?\d+)$/);
 if(m){const d=+m[2];return d?+m[1]/d:NaN;}
 if(/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return Number(s);
 return NaN;
}
function mathAnswered(){const {rec}=mathRecord(mathSelectedGrade(),mathState.day);return rec.items?.[mathState.question]||null;}
function mathSubmit(){
 const task=mathCurrent();if(!task)return;
 const value=mathState.pending.trim();const val=mathNormalizeAnswer(value);
 if(!Number.isFinite(val)){mathFeedback('Wpisz liczbę, np. 12, 3/4 albo 2,5. Без букв и единиц измерения.',true);mathRender();return;}
 const {p,key,rec}=mathRecord(mathSelectedGrade(),mathState.day);
 const x=rec.items[mathState.question]||{tries:0,done:false,first:false,usedHint:false};
 if(x.done)return;
 x.tries++;const good=Math.abs(val-task.n/task.d)<1e-7;
 if(good){x.done=true;x.first=x.tries===1&&!x.usedHint;x.revealed=false;x.answer=value;mathFeedback('Dobrze! ✅ Możesz zobaczyć rozwiązanie poniżej.',false);}
 else{mathFeedback(x.tries===1?'Jeszcze nie! Spróbuj ponownie. Możesz poprosić o wskazówkę.':'Nie szkodzi — spróbuj jeszcze raz lub zobacz rozwiązanie.',true);}
 rec.items[mathState.question]=x;
 if(Object.values(rec.items).filter(q=>q.done).length===10){rec.finished=rec.finished||new Date().toISOString();rec.score=Object.values(rec.items).filter(q=>q.first).length;}
 p.days[key]=rec;mathSave(p);mathRender();
 if(!good){const el=$('mathAnswer');if(el){el.focus();el.select();}}
}
function mathHint(){const {p,key,rec}=mathRecord(mathSelectedGrade(),mathState.day);
 const q=rec.items[mathState.question]||{tries:0,done:false,first:false,usedHint:false};
 if(q.done)return;q.usedHint=true;rec.items[mathState.question]=q;p.days[key]=rec;mathSave(p);
 mathFeedback('💡 '+mathCurrent().hint+(mathState.ru?' / '+mathCurrent().hintRu:''),false);mathRender();
}
function mathReveal(){const {p,key,rec}=mathRecord(mathSelectedGrade(),mathState.day);
 const q=rec.items[mathState.question]||{tries:0,done:false,first:false,usedHint:false};if(q.done)return;
 q.done=true;q.first=false;q.revealed=true;q.answer='';rec.items[mathState.question]=q;
 if(Object.values(rec.items).filter(q=>q.done).length===10){rec.finished=rec.finished||new Date().toISOString();rec.score=Object.values(rec.items).filter(q=>q.first).length;}
 p.days[key]=rec;mathSave(p);mathFeedback('Zobacz, jak otrzymujemy wynik. Potem spróbuj podobnego zadania!',false);mathRender();
}
function mathNext(){const current=mathAnswered();if(!current?.done)return;
 mathState.question++;mathState.pending='';mathState.feedback='';mathState.error=false;
 if(mathState.question>=10)mathState.phase='summary';mathRender();}
function mathBack(){mathState.phase='overview';mathState.pending='';mathState.feedback='';mathRender();}
function mathRepeat(){const grade=mathSelectedGrade(),day=mathState.day;
 if(!confirm('Rozpocząć ten dzień od nowa? Poprzedni wynik tego dnia zostanie usunięty.'))return;
 const p=mathLoad(state.user);delete p.days[mathDayKey(grade,day)];mathSave(p);mathStartDay(day);}
function mathReset(){if(!state.user)return;if(!confirm('Удалить ВСЕ результаты по математике выбранной ученицы на ЭТОМ устройстве?'))return;
 try{localStorage.removeItem(MATH_KEY+state.user)}catch{}mathState.phase='overview';mathRender();}
function mathDayTile(day,grade,p){const data=MATH_DATA[String(grade)][day],rec=p.days[mathDayKey(grade,day)];
 const solved=Object.values(rec?.items||{}).filter(x=>x.done).length;
 return `<article class="math-day ${rec?.finished?'math-completed':''}"><div class="math-day-header"><span class="math-emoji">${data.icon}</span><span class="math-day-count">Dzień ${day+1}/30</span></div><h3>${h(data.name)}</h3><p>${solved} / 10 zadań ${rec?.finished?'· ✅ zakończone':''}</p><button class="btn ${rec?.finished?'':'primary'}" type="button" data-math="start" data-day="${day}">${rec?.finished?'Powtórz':'Rozpocznij →'}</button></article>`;
}
function mathRender(){const root=$('view-math');if(!root)return;
 if(!state.user){root.innerHTML=picker();return;}
 const grade=mathSelectedGrade(),topics=MATH_DATA[String(grade)],p=mathLoad(state.user);
 const stats=mathRowStats(state.user,grade);
 const menu=`<div class="math-section-title"><div><h2>🔢 Matematyka</h2><p class="sub">${h(profileName())} · Klasa ${grade} · 30 dni × 10 zadań</p></div><label for="mathGrade" class="math-grade-label">Klasa <select id="mathGrade" aria-label="Wybierz klasę"><option value="5" ${grade===5?'selected':''}>5</option><option value="7" ${grade===7?'selected':''}>7</option></select></label></div>`;
 if(mathState.phase==='overview'){
 const n=mathNextUnfinished();
 root.innerHTML=menu+`<div class="math-intro"><div><span class="math-chip">🇵🇱 Zadania po polsku · 🇷🇺 Помощь по-русски</span><h3>Matematyka krok po kroku ✨</h3><p>Najpierw rozwiąż 10 zadań. Jeśli popełnisz błąd, możesz poprawić odpowiedź, wyświetlić podpowiedź lub zobaczyć rozwiązanie.</p><button class="btn primary" data-math="start" data-day="${n}">🚀 Kontynuuj — dzień ${n+1}</button></div><div class="math-orb">${grade===5?'📐':'🧠'}</div></div>
 <div class="math-summary-grid"><div class="math-stat"><strong>${stats.done}</strong><span>Dni ukończone</span></div><div class="math-stat"><strong>${stats.solved}</strong><span>Zadań zakończonych</span></div><div class="math-stat"><strong>${stats.first}</strong><span>Poprawnie bez podpowiedzi</span></div></div>
 <div class="math-section-title"><h3>📅 Program na 30 dni</h3><span class="pill">${stats.done}/30</span></div>
 <p class="sub">Możesz przerabiać program po kolei albo wybrać dowolny temat, który jest teraz w szkole.</p>
 <div class="math-days">${topics.map((_,i)=>mathDayTile(i,grade,p)).join('')}</div>
 <div class="hint" style="margin-top:20px">📌 Ćwiczenia rozwijają umiejętności matematyczne dla klas 5 i 7. Kolejność tematów w szkole może być inna. Wyniki zapisują się tylko w tej przeglądarce. Rozwiązania są przygotowane z góry — to jeszcze nie nauczyciel AI.</div>`;
 return;
 }
 if(mathState.phase==='summary'){
 const rec=p.days[mathDayKey(grade,mathState.day)]||{items:{},score:0};
 const solved=Object.values(rec.items||{}).filter(q=>q.done).length;
 root.innerHTML=menu+`<div class="math-task-panel" style="text-align:center"><div style="font-size:56px">🎉</div><h2>Brawo! Dzień ${mathState.day+1} ukończony</h2><p class="sub">${h(topics[mathState.day].name)} · Klasa ${grade}</p><div class="math-summary-grid"><div class="math-stat"><strong>${solved}/10</strong><span>Wykonane</span></div><div class="math-stat"><strong>${rec.score||0}/10</strong><span>Za pierwszym razem</span></div></div><p>Możesz powtórzyć ten dzień lub przejść do następnego tematu.</p><div class="math-actions" style="justify-content:center"><button class="btn" data-math="back">📅 Wszystkie dni</button><button class="btn" data-math="repeat">🔁 Spróbuj ponownie</button>${mathState.day<29?`<button class="btn primary" data-math="start" data-day="${mathState.day+1}">Następny dzień →</button>`:''}</div></div>`;return;
 }
 const topic=topics[mathState.day],task=topic.tasks[mathState.question];
 const item=p.days[mathDayKey(grade,mathState.day)]?.items?.[mathState.question]||null;
 const done=item?.done;const solved=p.days[mathDayKey(grade,mathState.day)]?.items||{};
 const count=Object.values(solved).filter(q=>q.done).length;
 root.innerHTML=menu+`<div class="math-task-panel">
 <div class="math-task-top"><button class="btn small" data-math="back">← Do programu</button><span class="pill">Dzień ${mathState.day+1} · ${h(topic.name)}</span></div>
 <div class="math-section-title"><h2>${topic.icon} Zadanie ${mathState.question+1} / 10</h2><span class="math-progress-number">${count}/10</span></div>
 <div class="math-bar"><span style="width:${count*10}%"></span></div>
 <div class="math-question" role="group" aria-label="Zadanie matematyczne">${h(task.q)}</div>
 <p class="sub">Wpisz tylko liczbę (np. <b>12</b>, <b>3/4</b> lub <b>2,5</b>)${task.unit?' — jednostka: '+h(task.unit):''}.</p>
 ${!done?`<div class="math-answer-row"><input class="math-answer" id="mathAnswer" value="${attr(mathState.pending)}" type="text" inputmode="decimal" placeholder="Twoja odpowiedź" autocomplete="off" spellcheck="false" aria-label="Wpisz wynik"/><button class="btn primary" type="button" data-math="check">✅ Sprawdź</button></div>
 <div class="math-actions"><button class="btn small" type="button" data-math="hint">💡 Podpowiedź</button><button class="btn small" type="button" data-math="reveal">👀 Pokaż rozwiązanie</button></div>`:''}
 ${mathState.feedback?`<div class="math-feedback ${mathState.error?'math-bad':'math-good'}" role="status">${h(mathState.feedback)}</div>`:''}
 ${done?`<div class="math-solution"><div class="math-correct">✅ Wynik: <strong>${h(task.ans)}${task.unit?' '+h(task.unit):''}</strong></div><h3>📝 Wyjaśnienie po polsku</h3><p>${h(task.steps)}</p><details ${mathState.ru?'open':''}><summary>🇷🇺 Объяснение на русском</summary><p>${h(task.ru)}</p></details></div>
 <div class="math-actions"><button class="btn primary" data-math="next">${mathState.question===9?'🏆 Zakończ dzień':'Następne zadanie →'}</button></div>`:''}
 </div>`;
}
function mathParentSummary(){const node=$('view-parent');if(!node)return;const stats=STUDENTS.map(s=>{const grade=s.id==='Доминика'?7:5;const x=mathRowStats(s.id,grade);return `<div class="math-stat"><strong>${x.done}/30</strong><span>${h(s.name)} · klasa ${grade}<br/>${x.solved} wykonanych zadań, ${x.first} bez pomocy</span></div>`;}).join('');
 node.insertAdjacentHTML('beforeend',`<section class="panel"><h3>🔢 Matematyka — postępy na tym urządzeniu</h3><div class="math-summary-grid">${stats}</div><p class="sub">To są dane zapisane wyłącznie w tej przeglądarce. Wyników z telefonów nie widać bez synchronizacji.</p></section>`);
}
// Capture math actions, leaving the original English-school event handlers untouched.
document.addEventListener('click',e=>{const b=e.target.closest('[data-math]');if(!b)return;e.preventDefault();e.stopPropagation();
 switch(b.dataset.math){case 'start':mathStartDay(b.dataset.day);break;case 'back':mathBack();break;case 'check':mathSubmit();break;case 'hint':mathHint();break;case 'reveal':mathReveal();break;case 'next':mathNext();break;case 'repeat':mathRepeat();break;case 'reset':mathReset();break;}
},true);
document.addEventListener('change',e=>{if(e.target.id==='mathGrade')mathChooseGrade(e.target.value);});
document.addEventListener('input',e=>{if(e.target.id==='mathAnswer')mathState.pending=e.target.value;});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='mathAnswer'){e.preventDefault();mathState.pending=e.target.value;mathSubmit();}},true);

render();

</script>
