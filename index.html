<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI School</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#243451;background:#edf3ff}body{margin:0;padding:24px}main{max-width:800px;margin:auto}header,.panel{background:white;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 3px 14px #2334  }h1{margin:0}button,select{font:inherit;padding:11px 15px;border-radius:10px;border:1px solid #b7c5e2;background:#fff;margin:5px;cursor:pointer}button.primary{background:#315ad7;color:white;border:0}button:disabled{opacity:.5}input{font:inherit;padding:12px;width:min(90%,450px);border:1px solid #aab7ce;border-radius:10px}.muted{color:#59687c}.hidden{display:none}.choice{display:block;text-align:left;width:90%}.correct{color:#16713d}.wrong{color:#a53131}.pill{display:inline-block;background:#e9efff;border-radius:20px;padding:5px 12px;margin:4px}progress{width:100%;height:16px} .word{font-size:30px;font-weight:bold}footer{font-size:13px;color:#5e687a;margin-top:20px}</style></head><body><main>
<header><h1>🎓 AI School</h1><p>Английский с объяснениями по-польски и по-русски</p></header>
<section id="home" class="panel"><h2>Выбери ученицу</h2><button class="primary" onclick="start('Доминика')">👩‍🎓 Доминика</button><button class="primary" onclick="start('Даниэла')">👩‍🎓 Даниэла</button><h3>Прогресс</h3><div id="overview"></div><button onclick="resetConfirm()">Сбросить прогресс</button></section>
<section id="study" class="panel hidden"><button onclick="goHome()">← Выбор ученицы</button><h2 id="student"></h2><div id="stats"></div><label>Уровень: <select id="level" onchange="changeLevel()"><option value="0">Начальный</option><option value="1">Средний</option><option value="2">Продвинутый</option></select></label><div id="question"></div><p id="feedback" aria-live="polite"></p><button id="next" class="primary hidden" onclick="nextQuestion()">Следующее задание →</button></section>
<footer>Работает без интернета и подписки. Результаты хранятся только в этом браузере на этом устройстве. Это учебный прототип, не ИИ-репетитор.</footer>
</main><script>
const DATA=[
[{en:'cat',pl:'kot',ru:'кот',example:'The cat is sleeping.',ep:'Kot śpi.',er:'Кот спит.'},{en:'dog',pl:'pies',ru:'собака',example:'The dog is happy.',ep:'Pies jest szczęśliwy.',er:'Собака счастлива.'},{en:'apple',pl:'jabłko',ru:'яблоко',example:'I eat an apple.',ep:'Jem jabłko.',er:'Я ем яблоко.'},{en:'book',pl:'książka',ru:'книга',example:'This is my book.',ep:'To moja książka.',er:'Это моя книга.'},{en:'water',pl:'woda',ru:'вода',example:'I drink water.',ep:'Piję wodę.',er:'Я пью воду.'},{en:'school',pl:'szkoła',ru:'школа',example:'I go to school.',ep:'Chodzę do szkoły.',er:'Я хожу в школу.'},{en:'house',pl:'dom',ru:'дом',example:'My house is small.',ep:'Mój dom jest mały.',er:'Мой дом маленький.'},{en:'friend',pl:'przyjaciel',ru:'друг',example:'She is my friend.',ep:'Ona jest moją przyjaciółką.',er:'Она моя подруга.'},{en:'red',pl:'czerwony',ru:'красный',example:'The bag is red.',ep:'Torba jest czerwona.',er:'Сумка красная.'},{en:'happy',pl:'szczęśliwy',ru:'счастливый',example:'I am happy.',ep:'Jestem szczęśliwa.',er:'Я счастлива.'}],
[{en:'breakfast',pl:'śniadanie',ru:'завтрак',example:'I have breakfast at eight.',ep:'Jem śniadanie o ósmej.',er:'Я завтракаю в восемь.'},{en:'usually',pl:'zwykle',ru:'обычно',example:'I usually walk to school.',ep:'Zwykle chodzę pieszo do szkoły.',er:'Я обычно хожу в школу пешком.'},{en:'because',pl:'ponieważ',ru:'потому что',example:'I stayed home because it rained.',ep:'Zostałam w domu, ponieważ padało.',er:'Я осталась дома, потому что шёл дождь.'},{en:'weather',pl:'pogoda',ru:'погода',example:'The weather is nice.',ep:'Pogoda jest ładna.',er:'Погода хорошая.'},{en:'interesting',pl:'interesujący',ru:'интересный',example:'This story is interesting.',ep:'Ta historia jest interesująca.',er:'Эта история интересная.'},{en:'yesterday',pl:'wczoraj',ru:'вчера',example:'Yesterday I read a book.',ep:'Wczoraj czytałam książkę.',er:'Вчера я читала книгу.'},{en:'tomorrow',pl:'jutro',ru:'завтра',example:'Tomorrow we will play.',ep:'Jutro będziemy grać.',er:'Завтра мы будем играть.'},{en:'always',pl:'zawsze',ru:'всегда',example:'I always brush my teeth.',ep:'Zawsze myję zęby.',er:'Я всегда чищу зубы.'},{en:'sometimes',pl:'czasami',ru:'иногда',example:'Sometimes I draw.',ep:'Czasami rysuję.',er:'Иногда я рисую.'},{en:'question',pl:'pytanie',ru:'вопрос',example:'I have a question.',ep:'Mam pytanie.',er:'У меня есть вопрос.'}],
[{en:'although',pl:'chociaż',ru:'хотя',example:'Although it was cold, we went out.',ep:'Chociaż było zimno, wyszliśmy.',er:'Хотя было холодно, мы вышли.'},{en:'however',pl:'jednak',ru:'однако',example:'However, I disagree.',ep:'Jednak się nie zgadzam.',er:'Однако я не согласна.'},{en:'environment',pl:'środowisko',ru:'окружающая среда',example:'We protect the environment.',ep:'Chronimy środowisko.',er:'Мы защищаем окружающую среду.'},{en:'achievement',pl:'osiągnięcie',ru:'достижение',example:'This is a great achievement.',ep:'To wielkie osiągnięcie.',er:'Это большое достижение.'},{en:'opportunity',pl:'okazja',ru:'возможность',example:'This is a good opportunity.',ep:'To dobra okazja.',er:'Это хорошая возможность.'},{en:'improve',pl:'poprawiać',ru:'улучшать',example:'I want to improve my English.',ep:'Chcę poprawić swój angielski.',er:'Я хочу улучшить английский.'},{en:'knowledge',pl:'wiedza',ru:'знания',example:'Knowledge is useful.',ep:'Wiedza jest przydatna.',er:'Знания полезны.'},{en:'experience',pl:'doświadczenie',ru:'опыт',example:'It was a new experience.',ep:'To było nowe doświadczenie.',er:'Это был новый опыт.'},{en:'decision',pl:'decyzja',ru:'решение',example:'It was a difficult decision.',ep:'To była trudna decyzja.',er:'Это было трудное решение.'},{en:'responsibility',pl:'odpowiedzialność',ru:'ответственность',example:'Responsibility matters.',ep:'Odpowiedzialność ma znaczenie.',er:'Ответственность важна.'}]];
let who='',level=0,index=0,mode='learn',answered=false;const key=n=>'aischool-v2-'+n;function get(n){try{return JSON.parse(localStorage.getItem(key(n)))||{}}catch{return {}}}function put(n,v){try{localStorage.setItem(key(n),JSON.stringify(v))}catch{alert('Браузер не смог сохранить прогресс.')}}function profile(){return get(who)}function save(p){put(who,p)}function el(id){return document.getElementById(id)}function overview(){el('overview').innerHTML=['Доминика','Даниэла'].map(n=>{let p=get(n);return `<p><b>${n}:</b> правильных ответов ${p.correct||0}, попыток ${p.attempts||0}, изучено слов ${Object.keys(p.known||{}).length}</p>`}).join('')}function start(n){who=n;const p=profile();level=p.level||0;index=p.index||0;mode='learn';el('level').value=level;el('home').classList.add('hidden');el('study').classList.remove('hidden');el('student').textContent=n;render()}function goHome(){el('study').classList.add('hidden');el('home').classList.remove('hidden');overview()}function changeLevel(){level=Number(el('level').value);index=0;mode='learn';const p=profile();p.level=level;p.index=index;save(p);render()}function current(){return DATA[level][index%DATA[level].length]}function speak(s){if(!('speechSynthesis'in window)){alert('На этом устройстве озвучивание недоступно');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}function render(){answered=false;el('feedback').textContent='';el('next').classList.add('hidden');const p=profile();el('stats').innerHTML=`<span class="pill">Верно: ${p.correct||0}</span><span class="pill">Попыток: ${p.attempts||0}</span><span class="pill">Слов: ${Object.keys(p.known||{}).length}</span>`;const w=current();let h=`<p class="muted">Слово ${index+1} из ${DATA[level].length} · ${mode==='learn'?'Изучение':'Проверка'}</p><progress value="${index+1}" max="${DATA[level].length}"></progress>`;if(mode==='learn'){h+=`<div class="word">${w.en}</div><p>🇵🇱 ${w.pl} &nbsp; | &nbsp; 🇷🇺 ${w.ru}</p><button onclick="speak(current().en)">🔊 Слушать слово</button><p><b>${w.example}</b></p><p>🇵🇱 ${w.ep}<br>🇷🇺 ${w.er}</p><button onclick="speak(current().example)">🔊 Слушать пример</button><p><button class="primary" onclick="mode='test';render()">Проверить, запомнила ли я</button></p>`}else{h+=`<h3>Напиши по-английски:</h3><p>🇵🇱 ${w.pl}<br>🇷🇺 ${w.ru}</p><input id="answer" autocomplete="off" placeholder="Английское слово" onkeydown="if(event.key==='Enter')check()"><p><button class="primary" onclick="check()">Проверить</button> <button onclick="mode='learn';render()">Подсказка</button></p>`}el('question').innerHTML=h}function check(){if(answered)return;const w=current(),a=el('answer').value.trim().toLocaleLowerCase('en-US');if(!a){el('feedback').textContent='Сначала введи ответ.';return}answered=true;const ok=a===w.en.toLowerCase(),p=profile();p.attempts=(p.attempts||0)+1;p.known=p.known||{};if(ok){p.correct=(p.correct||0)+1;p.known[level+'-'+w.en]=true}else{delete p.known[level+'-'+w.en]}save(p);el('feedback').className=ok?'correct':'wrong';el('feedback').textContent=ok?'✅ Правильно! Молодец!':'❌ Правильный ответ: '+w.en+'. Повторим это слово позже.';el('next').classList.remove('hidden');el('answer').disabled=true;renderStats()}function renderStats(){const p=profile();el('stats').innerHTML=`<span class="pill">Верно: ${p.correct||0}</span><span class="pill">Попыток: ${p.attempts||0}</span><span class="pill">Слов: ${Object.keys(p.known||{}).length}</span>`}function nextQuestion(){index=(index+1)%DATA[level].length;const p=profile();p.index=index;p.level=level;save(p);mode='learn';render()}function resetConfirm(){if(confirm('Удалить результаты ОБЕИХ учениц на этом устройстве?')){['Доминика','Даниэла'].forEach(n=>localStorage.removeItem(key(n)));overview()}}overview();
</script></body></html>
